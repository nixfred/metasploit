version: '3.8'

# Metasploit Learning Lab - Vulnerable Targets
# Usage: docker-compose up <service-name>
# Example: docker-compose up dvwa

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:
  # ============================================================
  # DVWA - Damn Vulnerable Web Application
  # Classic web app vulnerabilities: SQLi, XSS, CSRF, etc.
  # ============================================================
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    networks:
      lab:
        ipv4_address: 172.20.0.10
    ports:
      - "8080:80"
    environment:
      - RECAPTCHA_PRIV_KEY=""
      - RECAPTCHA_PUB_KEY=""
    restart: unless-stopped

  # ============================================================
  # Metasploitable2 - Classic vulnerable Linux
  # Multiple services: FTP, SSH, Telnet, Samba, etc.
  # ============================================================
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    networks:
      lab:
        ipv4_address: 172.20.0.20
    ports:
      - "2221:21"    # FTP
      - "2222:22"    # SSH
      - "2223:23"    # Telnet
      - "2280:80"    # HTTP
      - "22445:445"  # SMB
    restart: unless-stopped
    tty: true
    stdin_open: true

  # ============================================================
  # Juice Shop - Modern OWASP vulnerabilities
  # Node.js app with 100+ vulns
  # ============================================================
  juiceshop:
    image: bkimminich/juice-shop
    container_name: juiceshop
    networks:
      lab:
        ipv4_address: 172.20.0.30
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ============================================================
  # WebGoat - OWASP Learning Platform
  # Guided lessons for web security
  # ============================================================
  webgoat:
    image: webgoat/webgoat
    container_name: webgoat
    networks:
      lab:
        ipv4_address: 172.20.0.40
    ports:
      - "8081:8080"
      - "9090:9090"
    environment:
      - WEBGOAT_HOST=0.0.0.0
    restart: unless-stopped

  # ============================================================
  # Mutillidae - OWASP Top 10 practice
  # ============================================================
  mutillidae:
    image: citizenstig/nowasp
    container_name: mutillidae
    networks:
      lab:
        ipv4_address: 172.20.0.50
    ports:
      - "8082:80"
    restart: unless-stopped

  # ============================================================
  # Vulnerable WordPress
  # Common CMS vulnerabilities
  # ============================================================
  vulnerable-wordpress:
    image: wpscanteam/vulnerablewordpress
    container_name: vulnerable-wordpress
    networks:
      lab:
        ipv4_address: 172.20.0.60
    ports:
      - "8083:80"
      - "3306:3306"
    restart: unless-stopped

  # ============================================================
  # VulnHub-style: Kioptrix Level 1
  # Boot2root challenge
  # ============================================================
  # Note: Most VulnHub VMs need to be run separately in VirtualBox/VMware
  # as they're full OS images, not Docker containers

  # ============================================================
  # Honeypot - Cowrie SSH/Telnet
  # For studying attacker behavior
  # ============================================================
  cowrie:
    image: cowrie/cowrie
    container_name: cowrie-honeypot
    networks:
      lab:
        ipv4_address: 172.20.0.100
    ports:
      - "2224:2222"  # SSH honeypot
      - "2225:2223"  # Telnet honeypot
    volumes:
      - ./targets/honeypot/cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped
