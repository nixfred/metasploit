version: '3.8'

# =============================================================================
# PENTESTING LEARNING LAB - Vulnerable Targets
# =============================================================================
# Usage: docker-compose up <service-name>
# Example: docker-compose up dvwa vsftpd -d
#
# All services bind to localhost (127.0.0.1) for safety.
# Internal network: 172.20.0.0/24
# =============================================================================

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1

services:

  # ===========================================================================
  # WEB APPLICATION TARGETS
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # DVWA - Damn Vulnerable Web Application
  # Classic web vulns: SQLi, XSS, CSRF, Command Injection, File Upload
  # Default creds: admin/password
  # ---------------------------------------------------------------------------
  dvwa:
    image: vulnerables/web-dvwa
    container_name: dvwa
    hostname: dvwa
    networks:
      lab:
        ipv4_address: 172.20.0.10
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # bWAPP - Buggy Web Application (100+ vulnerabilities)
  # Default creds: bee/bug
  # ---------------------------------------------------------------------------
  bwapp:
    image: raesene/bwapp
    container_name: bwapp
    hostname: bwapp
    networks:
      lab:
        ipv4_address: 172.20.0.70
    ports:
      - "127.0.0.1:8072:80"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Juice Shop - Modern OWASP Top 10
  # Node.js app with 100+ vulns and built-in scoreboard
  # ---------------------------------------------------------------------------
  juiceshop:
    image: bkimminich/juice-shop
    container_name: juiceshop
    hostname: juiceshop
    networks:
      lab:
        ipv4_address: 172.20.0.30
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # WebGoat - OWASP Learning Platform
  # Guided lessons for each vulnerability type
  # ---------------------------------------------------------------------------
  webgoat:
    image: webgoat/webgoat
    container_name: webgoat
    hostname: webgoat
    networks:
      lab:
        ipv4_address: 172.20.0.40
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:9090:9090"
    environment:
      - WEBGOAT_HOST=0.0.0.0
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Mutillidae - OWASP Top 10 Practice
  # ---------------------------------------------------------------------------
  mutillidae:
    image: citizenstig/nowasp
    container_name: mutillidae
    hostname: mutillidae
    networks:
      lab:
        ipv4_address: 172.20.0.50
    ports:
      - "127.0.0.1:8082:80"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vulnerable WordPress
  # Outdated plugins, weak configs
  # ---------------------------------------------------------------------------
  vulnerable-wordpress:
    image: wpscanteam/vulnerablewordpress
    container_name: vulnerable-wordpress
    hostname: vulnwp
    networks:
      lab:
        ipv4_address: 172.20.0.60
    ports:
      - "127.0.0.1:8083:80"
    restart: unless-stopped

  # ===========================================================================
  # SERVICE EXPLOITS (The fun stuff for Metasploit)
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # vsftpd 2.3.4 - Famous Backdoor (EASY WIN - Start Here!)
  # MSF: exploit/unix/ftp/vsftpd_234_backdoor
  # Gives root shell immediately
  # ---------------------------------------------------------------------------
  vsftpd:
    image: vulnerables/vsftpd-2.3.4
    container_name: vsftpd
    hostname: vsftpd
    networks:
      lab:
        ipv4_address: 172.20.0.15
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SambaCry - CVE-2017-7494
  # MSF: exploit/linux/samba/is_known_pipename
  # ---------------------------------------------------------------------------
  samba:
    image: vulnerables/cve-2017-7494
    container_name: samba
    hostname: vulnsmb
    networks:
      lab:
        ipv4_address: 172.20.0.16
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vulnerable SSH - Weak passwords for brute force practice
  # Use with Hydra or MSF auxiliary/scanner/ssh/ssh_login
  # Creds: root/toor, user/password
  # ---------------------------------------------------------------------------
  vulnssh:
    image: rastasheep/ubuntu-sshd:18.04
    container_name: vulnssh
    hostname: vulnssh
    networks:
      lab:
        ipv4_address: 172.20.0.17
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Vulnerable MySQL - Weak root password
  # Creds: root/root, admin/admin
  # ---------------------------------------------------------------------------
  vulnmysql:
    image: mysql:5.5
    container_name: vulnmysql
    hostname: vulnmysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vulnerable
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    networks:
      lab:
        ipv4_address: 172.20.0.18
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Tomcat with Manager exposed
  # MSF: exploit/multi/http/tomcat_mgr_upload
  # Creds: tomcat/tomcat
  # ---------------------------------------------------------------------------
  tomcat:
    image: vulnerables/web-tomcat
    container_name: tomcat
    hostname: vulntomcat
    networks:
      lab:
        ipv4_address: 172.20.0.19
    ports:
      - "127.0.0.1:8019:8080"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Metasploitable2 - Classic multi-service vulnerable Linux
  # FTP, SSH, Telnet, HTTP, Samba, MySQL, IRC, and more
  # ---------------------------------------------------------------------------
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: metasploitable2
    hostname: metasploitable2
    networks:
      lab:
        ipv4_address: 172.20.0.20
    ports:
      - "127.0.0.1:2221:21"    # FTP
      - "127.0.0.1:2222:22"    # SSH
      - "127.0.0.1:2223:23"    # Telnet
      - "127.0.0.1:2280:80"    # HTTP
    restart: unless-stopped
    tty: true
    stdin_open: true

  # ===========================================================================
  # HONEYPOT & UTILITIES
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Cowrie SSH/Telnet Honeypot
  # Study attacker behavior, capture credentials
  # ---------------------------------------------------------------------------
  cowrie:
    image: cowrie/cowrie
    container_name: cowrie-honeypot
    hostname: cowrie
    networks:
      lab:
        ipv4_address: 172.20.0.100
    ports:
      - "127.0.0.1:2224:2222"  # SSH honeypot
      - "127.0.0.1:2225:2223"  # Telnet honeypot
    volumes:
      - ./targets/honeypot/cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
    restart: unless-stopped

  # ===========================================================================
  # ATTACK BOX - Your Kali Linux with Web Terminal
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Kali Linux Attack Box - ALWAYS RUNNING
  # Access via browser: http://localhost:7681 (web terminal)
  # Or via docker: docker exec -it kali bash
  # Persistent: Entire /root directory survives restarts/rebuilds
  # Auto-starts: restart: always means it starts with Docker Desktop
  # ---------------------------------------------------------------------------
  kali:
    build: ./kali
    container_name: kali
    hostname: attackbox
    networks:
      lab:
        ipv4_address: 172.20.0.5
    ports:
      - "127.0.0.1:7681:7681"   # Web terminal (ttyd)
    volumes:
      - kali-home:/root                 # ENTIRE home directory persists!
      - ./wordlists:/root/wordlists:ro  # SecLists available (read-only overlay)
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: always    # Starts automatically with Docker Desktop
    tty: true
    stdin_open: true

  # ---------------------------------------------------------------------------
  # Dozzle - Real-time Docker log viewer
  # Access: http://localhost:9999
  # ---------------------------------------------------------------------------
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "127.0.0.1:9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - lab

# =============================================================================
# VOLUMES - Persistent storage
# =============================================================================
volumes:
  kali-home:     # Entire /root directory - survives rebuilds, persists forever
